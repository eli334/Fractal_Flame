<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Fractal Flame</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            height: 100%;
            width: 100%;
        }
        .controls-left {
            position: fixed;
            top: 12px; 
            left: 12px;
            display: flex; 
            gap: 8px; 
            align-items: center;
        }
        #quality { 
            position: fixed; 
            top: 12px; 
            right: 12px; 
        }
        #randomize { 
            width: 40px; 
            padding: 0; 
            font-size: 18px; 
            cursor: pointer; 
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;       /* stop the browser from panning/zooming the page itself on touch drag */
            image-rendering: pixelated; /* keep individual histogram bins crisp -- matches the desktop app's zoom-to-see-bins behavior */
        }
        #seed {
            width: 8em;
        }
        #seed::placeholder { 
            color: rgba(255,255,255,0.4);
        }
        #commit {
            position: fixed;
            top: 60px; left: 12px;
            width: 40px; padding: 0;
            font-size: 16px; cursor: pointer;
        }
        #commit:disabled {
            opacity: 0.35;
            cursor: default;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="controls-left">
        <button id="randomize" class="control">🎲</button>
        <input id="seed" class="control" inputmode="numeric" placeholder="seed" autocomplete="off">
        <button id="commit" class="control" title="re-render at current zoom" disabled>⛶</button>
    </div>

    <select id="quality" class="control" autocomplete="off">
        <option value="320">💩</option>
        <option value="640">🥔</option>  <!--selected in main()-->
        <option value="960">medium</option>
        <option value="1280">high</option>
        <option value="1920">ultra</option>
        <option value="3840">EXTREME</option>
    </select>

    <script>
        // Pan/zoom input state, polled and drained once per frame by
        // web_main.cpp's js_take_pan_dx/js_take_pan_dy/js_take_zoom_delta.
        // Pointer Events cover mouse-drag and single-finger touch-drag with
        // the same listeners, so this is the only pan code path needed for
        // both desktop and mobile. There's no pinch-to-zoom handling yet --
        // wheel-zoom only (desktop trackpad/mouse) for this first pass.
        var panDX = 0, panDY = 0, zoomFactor = 1;
        var dragging = false, lastX = 0, lastY = 0;

        var canvasElement = document.getElementById('canvas');

        var pointers = new Map(); // pointerId -> {x, y}
        var lastDist = 0;         // finger spacing on the previous pinch frame

        function pinchDist() {
            var it = pointers.values(); // it is an iterator of the pointers map
            var a = it.next().value, b = it.next().value; // a, b; finger (x, y) positions
            var dx = a.x - b.x, dy = a.y - b.y; // distance between fingers gives pinchDist
            return Math.hypot(dx, dy);
        }

        canvasElement.addEventListener('pointerdown', function (e) {
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            canvasElement.setPointerCapture(e.pointerId);
            if (pointers.size === 2) lastDist = pinchDist();
        });
        

        canvasElement.addEventListener('pointermove', function (e) {
            if (!pointers.has(e.pointerId)) return;            // no finger: return
            var p = pointers.get(e.pointerId);

            if (pointers.size === 1) {                         // one finger: pan
                panDX += e.clientX - p.x;
                panDY += e.clientY - p.y;
            } else if (pointers.size === 2) {                  // two fingers: pinch
                var d = pinchDist();
                if (lastDist !== 0) {
                    zoomFactor *= d / lastDist;
                }
                lastDist = d;
            }

            p.x = e.clientX;                                   // update the pointer's pos`ition
            p.y = e.clientY;
        });

        function endPointer(e) {
            pointers.delete(e.pointerId);
            lastDist = 0;
        }

        canvasElement.addEventListener('pointerup', endPointer);

        canvasElement.addEventListener('pointercancel', endPointer);

        canvasElement.addEventListener('wheel', function (e) {
            e.preventDefault();
            // Scale chosen to roughly match the native app's `wheel * 0.1` feel:
            // most mice report ~100 units of deltaY per notch, so 0.001 per unit
            // lands near 0.1 per notch. Trackpads report smaller continuous
            // deltas, so it should feel smoother there, not identical -- treat
            // this constant as a starting point to tune once you can try it.
            zoomFactor *= Math.exp(-e.deltaY * 0.001);
        }, { passive: false });


        var Module = {
            canvas: canvasElement,
            print: function (text) { console.log(text); },
            printErr: function (text) { console.error(text); }
        };
        
        var seedEl = document.getElementById('seed');
        seedEl.addEventListener('change', function () {   // fires on losing focus + Enter
            var v = parseInt(seedEl.value, 10);
            if (Module._apply_seed && !Number.isNaN(v)) Module._apply_seed(v);  // into WASM
            seedEl.blur();                                 // dismiss the keypad
        });

        var qualityEl = document.getElementById('quality');

        // if (window.matchMedia('(pointer: coarse)').matches) {
        //     // qualityEl.querySelector('option[value="3840"]').remove(); // might nuke this from phone
        // }

        qualityEl.addEventListener('change', function () {
            var q = parseInt(qualityEl.value, 10);
            if (Module._set_quality && !Number.isNaN(q)) Module._set_quality(q);
            qualityEl.blur();
        });

        var randomizeEl = document.getElementById('randomize');
        randomizeEl.addEventListener('click', function () {
            var seed = Math.floor(Math.random() * 4294967296); // unsigned 32-bit, matches the url space
            if (Module._apply_seed) Module._apply_seed(seed);
        });

        var commitEl = document.getElementById('commit');
        commitEl.addEventListener('click', function () {
            if (Module._commit_view) Module._commit_view();
        });

    </script>

    {{{ SCRIPT }}}
</body>
</html>
